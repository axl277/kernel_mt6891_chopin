Name: Build kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies & Cross Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev ccache zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld llvm

      - name: Run Build Script
        run: |
          chmod +x build.sh
          # Parameter -ksu dihapus karena KernelSU sudah di-uninstall
          ./build.sh chopin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel
          path: "*.zip"
