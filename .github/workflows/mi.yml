
name: Remove KernelSU

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch yang ingin dibersihkan"
        required: true
        type: choice
        options:
          - bomba
          - cgroup-v2-backport

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Remove KernelSU
        run: |
          git rm -rf drivers/kernelsu || true

          python3 - <<'PY'
          import os

          for path in ["drivers/Kconfig", "drivers/Makefile"]:
              if os.path.isfile(path):
                  with open(path) as f:
                      lines = f.readlines()

                  lines = [
                      line for line in lines
                      if "kernelsu" not in line.lower()
                  ]

                  with open(path, "w") as f:
                      f.writelines(lines)
          PY

          git add -A

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Remove KernelSU drivers integration"

          git push origin HEAD:${{ inputs.target_branch }}
