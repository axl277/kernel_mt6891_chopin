
name: Remove KernelSU Driver

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-kernelsu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chopin_16
          fetch-depth: 0

      - name: Remove KernelSU driver
        run: |
          set -e

          if [ -e drivers/kernelsu ] || [ -L drivers/kernelsu ]; then
            git rm -rf --ignore-unmatch drivers/kernelsu
            echo "KernelSU driver removed."
          else
            echo "KernelSU driver not found."
          fi

      - name: Remove KernelSU build references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("drivers/Kconfig"),
              Path("drivers/Makefile"),
          ]

          for path in files:
              if not path.exists():
                  continue

              lines = path.read_text().splitlines(keepends=True)
              filtered = [
                  line for line in lines
                  if "kernelsu" not in line.lower()
              ]

              if len(filtered) != len(lines):
                  path.write_text("".join(filtered))
                  print(f"Cleaned: {path}")
          PY

      - name: Check remaining references
        run: |
          git grep -ni kernelsu || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Remove KernelSU driver"
          git push origin HEAD:chopin_16
