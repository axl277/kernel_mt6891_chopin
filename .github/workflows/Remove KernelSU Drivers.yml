
name: Remove All KSU Drivers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-ksu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout chopin_16
        uses: actions/checkout@v4
        with:
          ref: chopin_16
          fetch-depth: 0

      - name: Remove KSU directories and symlinks
        run: |
          set -e

          PATHS=(
            "BakaSU"
            "KSU"
            "KernelSU"
            "KernelSU-Next"
            "KernelSUNext"
            "KOWSU"
            "SukiSU"
            "drivers/kernelsu"
          )

          for path in "${PATHS[@]}"; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              git rm -rf --ignore-unmatch -- "$path"
              echo "Removed: $path"
            else
              echo "Not found: $path"
            fi
          done

      - name: Remove KSU build references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          patterns = re.compile(
              r'bakasu|kernelsu|kowsu|sukisu|\bksu\b',
              re.IGNORECASE
          )

          files = [
              "Makefile",
              "Kconfig",
              "drivers/Makefile",
              "drivers/Kconfig",
          ]

          for filename in files:
              path = Path(filename)

              if not path.is_file():
                  continue

              lines = path.read_text().splitlines(keepends=True)
              filtered = [
                  line for line in lines
                  if not patterns.search(line)
              ]

              if len(filtered) != len(lines):
                  path.write_text("".join(filtered))
                  print(f"Cleaned: {filename}")
          PY

      - name: Check remaining references
        run: |
          echo "Checking remaining KSU references..."
          git grep -niE 'bakas[u]|kernelsu|kowsu|sukisu|ksu' || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Remove KSU implementations"
          git push origin HEAD:chopin_16
