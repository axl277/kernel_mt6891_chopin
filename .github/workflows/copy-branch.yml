
name: Copy chopin branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy branch from dashpin
        run: |
          git remote add source https://github.com/Hwhmi/kernel_xiaomi_mt6891chopin.git
          git fetch source chopin_16
          git push origin FETCH_HEAD:refs/heads/chopin_16