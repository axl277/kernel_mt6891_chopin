
name: Copy chopin branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy branch from dashpin
        run: |
          git remote add source https://github.com/TYOPXN360/kernel_mt6893.git
          git fetch source cgroup-v2-backport
          git push origin FETCH_HEAD:refs/heads/cgroup-v2-backport
